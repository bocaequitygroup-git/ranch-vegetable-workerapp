<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPOS Field App</title>
<style>
:root{--bg:#f4f3ee;--card:#ffffff;--text:#1c1e1a;--sub:#6c6f66;--accent:#2f6b3c;--accent-d:#245430;--warn:#c1531f;--border:#e2ded2;--radius:14px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;}}
:root[data-theme="dark"]{--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;}
.topbar .name{font-weight:700;font-size:15px;}
.topbar .role{color:var(--sub);font-size:12px;}
h1{font-size:19px;margin:4px 0 12px;}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.btn{background:var(--accent);color:#fff;border:none;padding:13px 16px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;}
.btn:active{background:var(--accent-d);}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn.warn{background:var(--warn);}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
input[type=text],input[type=password]{width:100%;padding:13px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--text);}
.sub{color:var(--sub);font-size:13px;}
.center{text-align:center;}
.timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:8px;margin-top:8px;}
.row>*{flex:1;}
.bed-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.bed-row:last-child{border-bottom:none;}
.bed-id{font-weight:700;}
.link{color:var(--accent);text-decoration:none;font-size:14px;display:inline-block;margin-top:10px;cursor:pointer;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent);color:#fff;}
.badge.paused{background:var(--warn);}
.err{color:var(--warn);font-size:13px;margin-top:8px;}
.act-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:8px;font-size:15px;color:var(--text);cursor:pointer;}
.act-btn.sel{border-color:var(--accent);background:rgba(47,107,60,0.12);}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ---- Seed reference data from VPOS_System.xlsx ---- */
const WORKERS=[
{id:'lisa',name:'Lisa Griffin',role:'Worker',pin:'1234'},
{id:'james',name:'James Clay',role:'Worker',pin:'2345'},
{id:'jon',name:'Jon Creem',role:'Worker',pin:'3456'},
{id:'linda',name:'Linda May',role:'Worker',pin:'4567'},
{id:'jessica',name:'Jessica Luka',role:'Worker',pin:'5678'},
{id:'usr-manager1',name:'Chris Kenny',role:'Manager',pin:'9999'},
{id:'usr-founder1',name:'Kisanga',role:'Founder',pin:'0000'}
];
const BLOCKS=[['B1','Block 1',55],['B2','Block 2',55],['B3','Block 3',55],['B4','Block 4',55],['Z5','Zone 5',11]];
const BED_NOTES={'B4-01':'Growing: Beets (BET-C01)'};
const ACTIVITIES=[['ACT_001','Field Prep'],['ACT_002','Bed Shaping'],['ACT_003','Mulching'],['ACT_004','Trellising Setup'],
['ACT_005','Irrigation Setup'],['ACT_006','Planting'],['ACT_007','Direct Seeding'],['ACT_008','Transplanting'],
['ACT_009','Replanting'],['ACT_010','Thinning'],['ACT_011','Weeding'],['ACT_012','Fertilizing'],
['ACT_013','Irrigation Check'],['ACT_014','Pest Control'],['ACT_015','Disease Control'],['ACT_016','Pruning'],
['ACT_017','Trellising'],['ACT_018','Harvest'],['ACT_019','Post-Harvest Cleanup'],['ACT_020','Field Turnover'],
['ACT_022','Crop Cleanup'],['ACT_023','Scouting']];

function allBeds(){const out=[];for(const[p,,n]of BLOCKS){for(let i=1;i<=n;i++)out.push(p+'-'+String(i).padStart(2,'0'));}return out;}
function bedBlock(id){const p=id.split('-')[0];const b=BLOCKS.find(x=>x[0]===p);return b?b[1]:'';}
function fmt(ms){if(ms<0)ms=0;let s=Math.floor(ms/1000);const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;
return(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function elapsed(s){const paused=s.totalPausedMs||0;if(s.status==='paused')return s.pausedAt-s.startTime-paused;
if(s.status==='completed')return s.endTime-s.startTime-paused;return Date.now()-s.startTime-paused;}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---- Local storage (this file runs standalone, so all data lives in this browser only) ---- */
function allSessions(){try{return JSON.parse(localStorage.getItem('vpos_sessions')||'[]');}catch(e){return[];}}
function saveSessions(arr){localStorage.setItem('vpos_sessions',JSON.stringify(arr));}

let tickTimer=null;
let st={screen:'login',me:null,nameInput:'',pinInput:'',err:null,sessions:[],scanQuery:'',selBed:null,selAct:null};

const savedId=localStorage.getItem('vpos_worker');
if(savedId){const w=WORKERS.find(x=>x.id===savedId);if(w){st.me=w;st.screen='home';}}

function loadForMe(){st.sessions=allSessions().filter(s=>s.workerId===st.me.id).sort((a,b)=>b.startTime-a.startTime);}
if(st.me)loadForMe();

function go(screen){st.screen=screen;st.err=null;render();}

function attemptLogin(){
 const n=(st.nameInput||'').trim().toLowerCase();
 const w=WORKERS.find(x=>x.name.toLowerCase()===n||x.id.toLowerCase()===n);
 if(!w||w.pin!==(st.pinInput||'')){st.err='Name or PIN not recognized.';render();return;}
 st.me=w;localStorage.setItem('vpos_worker',w.id);st.nameInput='';st.pinInput='';st.err=null;
 loadForMe();go('home');
}
function logOut(){localStorage.removeItem('vpos_worker');st.me=null;st.sessions=[];go('login');}

function startNewTask(){st.scanQuery='';st.selBed=null;st.selAct=null;go('scan');}
function processScan(){
 const q=(st.scanQuery||'').trim().toUpperCase();
 if(allBeds().includes(q))selectBed(q);
 else st.err='No bed found for "'+st.scanQuery+'". Try Search Beds below.';
 render();
}
function selectBed(id){st.selBed=id;st.selAct=null;go('activity');}
function selectAct(idx){st.selAct=ACTIVITIES[idx];render();}
function confirmStart(){
 if(!st.selBed||!st.selAct)return;
 const arr=allSessions();
 arr.push({id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),workerId:st.me.id,workerName:st.me.name,
  bedId:st.selBed,block:bedBlock(st.selBed),activityId:st.selAct[0],activityName:st.selAct[1],
  status:'active',startTime:Date.now(),totalPausedMs:0,pausedAt:null});
 saveSessions(arr);loadForMe();go('home');
}
function updateSession(id,patch){
 const arr=allSessions();const idx=arr.findIndex(s=>s.id===id);if(idx<0)return;
 arr[idx]={...arr[idx],...patch};saveSessions(arr);loadForMe();render();
}
function pauseS(id){updateSession(id,{status:'paused',pausedAt:Date.now()});}
function resumeS(id){const s=st.sessions.find(x=>x.id===id);
 updateSession(id,{status:'active',pausedAt:null,totalPausedMs:(s.totalPausedMs||0)+(Date.now()-s.pausedAt)});}
function completeS(id){updateSession(id,{status:'completed',endTime:Date.now()});}

function header(){
 if(!st.me)return'';
 return `<div class="topbar"><div><div class="name">${esc(st.me.name)}</div><div class="role">${esc(st.me.role)}</div></div>
 <button class="btn secondary" onclick="logOut()">Log Out</button></div>`;
}

function renderLogin(){
 return `<h1 class="center">🌱 VPOS Field App</h1><p class="sub center">Enter your name and PIN to log in</p>
 <div class="card">
 <label>Name</label>
 <input type="text" placeholder="e.g. Lisa Griffin" value="${esc(st.nameInput)}"
   oninput="st.nameInput=this.value" onkeydown="if(event.key==='Enter')document.getElementById('pinBox').focus()">
 <div style="height:10px;"></div>
 <label>PIN</label>
 <input id="pinBox" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" value="${esc(st.pinInput)}"
   oninput="st.pinInput=this.value.replace(/\\D/g,'').slice(0,4)" onkeydown="if(event.key==='Enter')attemptLogin()">
 ${st.err?`<p class="err">${esc(st.err)}</p>`:''}
 <button class="btn block" style="margin-top:14px;" onclick="attemptLogin()">Log In</button>
 </div>`;
}

function renderHome(){
 const active=st.sessions.filter(s=>s.status==='active'||s.status==='paused');
 const done=st.sessions.filter(s=>s.status==='completed').slice(0,15);
 return `${header()}
 <div class="row" style="margin-bottom:6px;"><h1 style="flex:2;">My Active Sessions</h1>
 <button class="btn secondary" style="flex:1;" onclick="loadForMe();render()">Refresh</button></div>
 ${active.length===0?'<p class="sub">No active tasks right now. Scan a bed to start one.</p>':
   active.map(s=>`<div class="card">
    <div class="row" style="margin-bottom:6px;"><div>
      <span class="badge ${s.status==='paused'?'paused':''}">${s.status.toUpperCase()}</span>
      <div style="font-weight:700;margin-top:6px;">${esc(s.bedId)} · ${esc(s.block)}</div>
      <div class="sub">${esc(s.activityName)}</div></div>
      <div class="timer" style="text-align:right;">${fmt(elapsed(s))}</div></div>
    <div class="row">
      ${s.status==='active'?`<button class="btn secondary" onclick="pauseS('${s.id}')">Pause</button>`
        :`<button class="btn secondary" onclick="resumeS('${s.id}')">Resume</button>`}
      <button class="btn warn" onclick="completeS('${s.id}')">Complete</button>
    </div></div>`).join('')}
 <button class="btn block" style="margin:14px 0;" onclick="startNewTask()">+ Start New Task</button>
 <h1>Completed History</h1>
 ${done.length===0?'<p class="sub">No completed tasks yet.</p>':
  done.map(s=>`<div class="card"><div class="row"><div>
    <div style="font-weight:700;">${esc(s.bedId)} · ${esc(s.block)}</div>
    <div class="sub">${esc(s.activityName)} · ${new Date(s.startTime).toLocaleDateString()}</div></div>
    <div class="timer" style="text-align:right;font-size:18px;">${fmt(elapsed(s))}</div></div></div>`).join('')}`;
}

function renderScan(){
 const q=(st.scanQuery||'').trim().toUpperCase();
 const results=q?allBeds().filter(b=>b.includes(q)).slice(0,30):[];
 return `${header()}
 <h1>Scan Location</h1>
 <p class="sub">Scan or Enter QR Code</p>
 <input type="text" placeholder="e.g. B1-01" value="${esc(st.scanQuery)}"
   oninput="st.scanQuery=this.value" onkeydown="if(event.key==='Enter')processScan()">
 <button class="btn block" style="margin-top:10px;" onclick="processScan()">Process Scan</button>
 ${st.err?`<p class="err">${esc(st.err)}</p>`:''}
 <p class="sub" style="margin-top:18px;">Or Search Beds (no camera needed)</p>
 <div class="card">${results.length?results.map(b=>`<div class="bed-row" onclick="selectBed('${b}')">
   <div><div class="bed-id">${b}</div><div class="sub">${esc(bedBlock(b))} · ${esc(BED_NOTES[b]||'Available')}</div></div>
   <div class="sub">›</div></div>`).join(''):`<p class="sub">${q?'No matching beds.':'Type a bed ID or block prefix (B1, B2, B3, B4, Z5) to search.'}</p>`}</div>
 <p class="link" onclick="go('home')">‹ Back to My Sessions</p>`;
}

function renderActivity(){
 return `${header()}
 <p class="link" onclick="go('scan')">‹ Back</p>
 <h1>Select Activity</h1>
 <div class="card"><div style="font-weight:700;">${esc(st.selBed)} · ${esc(bedBlock(st.selBed))}</div>
 <div class="sub">${esc(BED_NOTES[st.selBed]||'Available')}</div></div>
 ${ACTIVITIES.map((a,i)=>`<button class="act-btn ${st.selAct&&st.selAct[0]===a[0]?'sel':''}" onclick="selectAct(${i})">${esc(a[1])}</button>`).join('')}
 <button class="btn block" ${st.selAct?'':'disabled'} onclick="confirmStart()">Start Task ▶</button>`;
}

function render(){
 const el=document.getElementById('app');
 if(st.screen==='login')el.innerHTML=renderLogin();
 else if(st.screen==='home')el.innerHTML=renderHome();
 else if(st.screen==='scan')el.innerHTML=renderScan();
 else if(st.screen==='activity')el.innerHTML=renderActivity();
 if(tickTimer)clearInterval(tickTimer);
 if(st.screen==='home'&&st.sessions.some(s=>s.status==='active'))tickTimer=setInterval(render,1000);
}
render();
</script>
</body>
</html>
