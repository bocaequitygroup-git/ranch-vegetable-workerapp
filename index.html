<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkerApp — Ngapori Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-dark:#14261D;
  --sand:#F5F1E6; --paper:#FFFFFF; --ink:#1B1B18; --ink-soft:#5B5A52;
  --line:#DCD5C4;
  --ok:#2E7D32; --warn:#C77700; --danger:#B3261E; --irrigation:#C9622A;
  --accent:#1F3A2E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F;
  }
}
:root[data-theme="dark"]{
  --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--sand); color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:480px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column; background:var(--sand);
}
.topbar{
  position:sticky; top:0; z-index:10; background:var(--forest); color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar .brand{font-weight:800; font-size:15px; letter-spacing:.02em;}
.topbar .sub{font-size:11px; color:#C9D6CD; margin-top:1px;}
.topbar button{background:none;border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 10px;}
.content{flex:1; padding:18px 18px 90px;}
h1{font-size:22px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em;}
h2{font-size:15px; font-weight:700; margin:0 0 10px;}
p.lead{color:var(--ink-soft); font-size:14px; margin:0 0 20px; line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
input,select,textarea{
  width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:16px; background:var(--paper); color:var(--ink);
}
textarea{resize:vertical; min-height:70px;}
.btn{
  display:block; width:100%; text-align:center; padding:15px; border-radius:12px;
  font-family:inherit; font-size:15px; font-weight:700; border:none; cursor:pointer;
  margin-bottom:10px;
}
.btn-primary{background:var(--forest); color:#fff;}
.btn-primary:active{background:var(--forest-dark);}
.btn-outline{background:transparent; color:var(--forest); border:1.5px solid var(--forest);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-warn{background:var(--warn); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-soft); font-weight:600;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.card .row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;}
.card .row span:first-child{color:var(--ink-soft);}
.card .row span:last-child{font-weight:700; text-align:right;}
.chip{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.chip-ok{background:#E4F1E5; color:var(--ok);}
.chip-warn{background:#FBEBD6; color:var(--warn);}
.chip-danger{background:#F7DEDB; color:var(--danger);}
.chip-irr{background:#FBE4D4; color:var(--irrigation);}
:root[data-theme="dark"] .chip-ok,:root:not([data-theme="light"]) .chip-ok{background:#1E3320;}
:root[data-theme="dark"] .chip-warn,:root:not([data-theme="light"]) .chip-warn{background:#3A2A10;}
:root[data-theme="dark"] .chip-danger,:root:not([data-theme="light"]) .chip-danger{background:#3A1D1B;}
:root[data-theme="dark"] .chip-irr,:root:not([data-theme="light"]) .chip-irr{background:#3A2515;}
.activity-btn{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  padding:16px; margin-bottom:10px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--paper); font-family:inherit; font-size:15px; font-weight:700; color:var(--ink);
  cursor:pointer; text-align:left;
}
.activity-btn:active{border-color:var(--forest);}
.activity-btn .tag{font-size:11px; font-weight:600; color:var(--ink-soft);}
.timer{
  font-size:52px; font-weight:800; text-align:center; letter-spacing:-.02em;
  padding:24px 0 10px; font-variant-numeric:tabular-nums;
}
.timer-status{text-align:center; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:18px; text-transform:none;}
.quickcodes{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px;}
.quickcode{padding:8px 12px; border-radius:9px; border:1.5px dashed var(--line); background:transparent; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.error{background:#F7DEDB; color:var(--danger); padding:11px 14px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:14px;}
.toast{
  position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--sand); padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:600;
  z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:88%; text-align:center;
}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;}
.sheet{
  background:var(--sand); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
}
.sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 16px;}
.segbtns{display:flex; gap:8px; margin-bottom:14px;}
.segbtns button{flex:1; padding:11px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper); font-family:inherit; font-weight:700; font-size:13px; color:var(--ink); cursor:pointer;}
.segbtns button.active{background:var(--forest); color:#fff; border-color:var(--forest);}
.navbar{
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  background:var(--paper); border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:space-around; max-width:480px; margin:0 auto;
}
.navitem{background:none; border:none; font-family:inherit; color:var(--ink-soft); font-size:11px; font-weight:700; text-align:center; cursor:pointer; padding:4px 8px;}
.navitem .dot{width:8px;height:8px;border-radius:50%; margin:0 auto 4px; background:var(--line);}
.navitem.active{color:var(--forest);}
.navitem.active .dot{background:var(--forest);}
.loglist{display:flex; flex-direction:column; gap:8px;}
.logrow{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px;}
.logrow .t1{font-weight:700; margin-bottom:2px;}
.logrow .t2{color:var(--ink-soft);}
.empty{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 10px;}
.kpad{display:none;}
.linkbtn{background:none;border:none;color:var(--forest);font-family:inherit;font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- mock reference data (stands in for CROP_ZONING_REFERENCE / BED_MASTER / USERS) ---------- */
const USERS = [
  {id:'USR-WORKER1', pin:'1234', name:'Jo Lindqvist'}
];
const BEDS = {
  'B1-17': {block:'Block 1', zone:'Zone A', cohort:'MCH-C01', crop:'Mesclun Mix', activities:['IrrigationCheck','Weeding','Harvest','Scouting']},
  'B2-04': {block:'Block 2', zone:'Zone B', cohort:'LET-C03', crop:'Butterhead Lettuce', activities:['Transplant','Scouting','IrrigationCheck']},
  'B3-11': {block:'Block 3', zone:'Zone C', cohort:'RAD-C02', crop:'Radish', activities:['DirectSeed','BedPrep','IrrigationCheck','PestControl']},
  'B4-09': {block:'Block 4', zone:'Zone A', cohort:'KAL-C01', crop:'Curly Kale', activities:['Harvest','Fertilizing','DiseaseControl','Scouting']}
};
const IRRIGATION_FAULTS = ['LEAK','BLOWOUT','CLOG','DRY_SPOT','LOW_PRESSURE','HIGH_PRESSURE'];
const SCOUT_DOMAINS = ['PlantCondition','PestPressure','DiseasePressure','SoilWater','WeedCompetition'];
const SEVERITIES = ['LOW','MEDIUM','HIGH','CRITICAL'];
const HARVEST_UNITS = ['lb','kg','each','bunches'];

/* ---------- persisted state (per-viewer only; this is a demo data layer, not the real Sheets backend) ---------- */
const STORE_KEY = 'workerapp_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    worker:null, screen:'login', loginErr:'', bedCode:'', bedErr:'', bed:null,
    activity:null, session:null, modal:null, modalDraft:{}, toast:'', navTab:'field',
    tables:{ liveSessions:[], activityLog:[], exceptions:[], scouting:[], location:[] },
    bedIrrigationStatus:{}
  };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
let S = loadState();

function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function toast(msg){ S.toast = msg; render(); saveState(); setTimeout(()=>{ if(S.toast===msg){ S.toast=''; render(); saveState(); } }, 2600); }

function elapsedMinutes(session){
  let total = 0;
  session.segments.forEach(seg=>{
    const end = seg.end ? new Date(seg.end) : new Date();
    total += (end - new Date(seg.start));
  });
  return Math.max(0, Math.round(total/60000));
}
function elapsedDisplay(session){
  let total = 0;
  session.segments.forEach(seg=>{
    const end = seg.end ? new Date(seg.end) : new Date();
    total += (end - new Date(seg.start));
  });
  const s = Math.max(0, Math.floor(total/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}

/* ---------- actions ---------- */
function doLogin(){
  const idEl = document.getElementById('in-workerid'), pinEl = document.getElementById('in-pin');
  const id = idEl.value.trim().toUpperCase(), pin = pinEl.value.trim();
  const u = USERS.find(u=>u.id.toUpperCase()===id && u.pin===pin);
  if(!u){ S.loginErr = 'Worker ID or PIN not recognized. Check your badge and try again.'; render(); return; }
  S.worker = u; S.loginErr=''; S.screen='scan'; render(); saveState();
}
function logout(){
  if(S.session){ toast('Complete or the session before logging out.'); return; }
  S.worker=null; S.screen='login'; S.bed=null; S.activity=null; render(); saveState();
}
function setBedCode(v){ S.bedCode = v; }
function resolveBed(){
  const code = (S.bedCode||'').trim().toUpperCase().replace(/^BED:/,'');
  const bed = BEDS[code];
  if(!bed){ S.bedErr = 'Unrecognized bed code — check the tag and try again.'; render(); return; }
  S.bed = Object.assign({id:code}, bed);
  S.bedErr=''; S.bedCode=''; S.screen='activity'; render(); saveState();
  S.tables.location.push({Worker_ID:S.worker.id, Bed_ID:code, Timestamp:nowISO()});
}
function pickQuick(code){ S.bedCode = code; resolveBed(); }
function chooseActivity(a){ S.activity = a; render(); }
function startSession(){
  if(!S.activity) return;
  S.session = {
    Activity_ID: uid('ACT'), Worker_ID:S.worker.id, Bed_ID:S.bed.id, Cohort_ID:S.bed.cohort,
    Crop_ID:S.bed.crop, Activity:S.activity, Start_Time:nowISO(), Session_Status:'ACTIVE',
    segments:[{start:nowISO(), end:null}], exceptionsLogged:0
  };
  S.tables.liveSessions.push(S.session);
  S.screen='session'; render(); saveState();
}
function pauseSession(){
  const seg = S.session.segments[S.session.segments.length-1];
  seg.end = nowISO(); S.session.Session_Status='PAUSED'; render(); saveState();
}
function resumeSession(){
  S.session.segments.push({start:nowISO(), end:null});
  S.session.Session_Status='ACTIVE'; render(); saveState();
}
function openModal(name){ S.modal = name; S.modalDraft = {}; render(); }
function closeModal(){ S.modal=null; S.modalDraft={}; render(); }
function draft(k,v){ S.modalDraft[k]=v; }

function submitException(){
  const d = S.modalDraft;
  if(!d.type || !d.severity){ toast('Type and severity are required.'); return; }
  const ex = {
    Exception_ID: uid('EXC'), Cohort_ID:S.bed.cohort, Exception_Type:d.type, Exception_Status:'OPEN',
    Blocked_Reason:'', Exception_Notes:d.notes||'', Exception_Date:nowISO(), Domain:d.type, Symptom:'',
    Severity:d.severity, Requires_Action:'TRUE', Worker:S.worker.id, Timestamp:nowISO(), Photo_URL:d.photo||'',
    Finding_ID:''
  };
  if(d.type==='Irrigation'){
    ex.Irrigation_Zone_ID = S.bed.zone;
    ex.Irrigation_Fault_Type = d.fault||'';
  }
  S.tables.exceptions.push(ex);
  S.session.exceptionsLogged++;
  toast('Exception reported to Manager queue.');
  closeModal(); saveState();
}

function finishActivityLog(extra){
  const s = S.session;
  const seg = s.segments[s.segments.length-1];
  if(!seg.end) seg.end = nowISO();
  const entry = Object.assign({
    Activity_ID:s.Activity_ID, Worker:S.worker.id, Bed_ID:s.Bed_ID, Crop_ID:s.Crop_ID,
    Task_Type:s.Activity, Start_Time:s.Start_Time, End_Time:nowISO(),
    Duration:elapsedMinutes(s)+' min', Notes:''
  }, extra||{});
  S.tables.activityLog.push(entry);
  S.tables.location.push({Worker_ID:S.worker.id, Bed_ID:s.Bed_ID, Timestamp:nowISO()});
  s.Session_Status='COMPLETED';
  S.session = null; S.activity=null; S.bed=null; S.modal=null; S.modalDraft={};
  S.screen='scan';
  toast('Session complete — logged to Activity Log.');
  saveState();
}

function completeGeneric(){
  const d = S.modalDraft;
  finishActivityLog({Quantity:d.qty||'', Unit:d.unit||'', Notes:d.notes||''});
}
function completeIrrigationCheck(){
  const d = S.modalDraft;
  if(!d.result){ toast('Choose PASS or FAIL.'); return; }
  if(d.result==='FAIL'){
    if(!d.fault){ toast('Select a fault type.'); return; }
    const ex = {
      Exception_ID: uid('EXC'), Cohort_ID:S.bed.cohort, Exception_Type:'IRRIGATION_FAULT', Exception_Status:'OPEN',
      Blocked_Reason:'', Exception_Notes:d.notes||'', Exception_Date:nowISO(), Domain:'Irrigation', Symptom:d.fault,
      Severity: (d.fault==='BLOWOUT'||d.fault==='LEAK') ? 'HIGH' : 'MEDIUM', Requires_Action:'TRUE',
      Worker:S.worker.id, Timestamp:nowISO(), Photo_URL:d.photo||'', Finding_ID:'',
      Irrigation_Zone_ID:S.bed.zone, Irrigation_Fault_Type:d.fault
    };
    S.tables.exceptions.push(ex);
    const sev = (d.fault==='BLOWOUT'||d.fault==='LEAK') ? 'CRITICAL':'AT_RISK';
    S.bedIrrigationStatus[S.bed.id] = sev;
  } else {
    S.bedIrrigationStatus[S.bed.id] = 'NORMAL';
  }
  finishActivityLog({Notes:'IrrigationCheck: '+d.result+(d.fault?(' / '+d.fault):'')+(d.notes?(' — '+d.notes):'')});
}
function completeScouting(){
  const d = S.modalDraft;
  if(!d.domain || !d.severity){ toast('Domain and severity are required.'); return; }
  const finding = {
    Finding_ID: uid('FND'), Bed_ID:S.bed.id, Cohort_ID:S.bed.cohort, Domain:d.domain, Symptom:d.symptom||'',
    Severity:d.severity, Requires_Action: d.requiresAction ? 'TRUE':'FALSE', Notes:d.notes||'', Photo_URL:d.photo||'',
    Worker:S.worker.id, Timestamp:nowISO(), Exception_ID:'', Resolved_Status:'OPEN'
  };
  if(d.requiresAction){
    const ex = {
      Exception_ID: uid('EXC'), Cohort_ID:S.bed.cohort, Exception_Type:d.domain, Exception_Status:'OPEN',
      Blocked_Reason:'', Exception_Notes:d.notes||'', Exception_Date:nowISO(), Domain:d.domain, Symptom:d.symptom||'',
      Severity:d.severity, Requires_Action:'TRUE', Worker:S.worker.id, Timestamp:nowISO(), Photo_URL:d.photo||'',
      Finding_ID:finding.Finding_ID
    };
    finding.Exception_ID = ex.Exception_ID;
    S.tables.exceptions.push(ex);
  }
  S.tables.scouting.push(finding);
  finishActivityLog({Notes:'Scouting: '+d.domain+' / '+d.severity});
}
function completeHarvest(){
  const d = S.modalDraft;
  if(!d.qty){ toast('Enter a quantity.'); return; }
  finishActivityLog({Quantity:d.qty, Unit:d.unit||HARVEST_UNITS[0]});
}

function setNav(tab){ S.navTab = tab; render(); saveState(); }

/* ---------- render ---------- */
function esc(s){ return (s===undefined||s===null) ? '' : String(s); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = screenHTML();
  const idEl = document.getElementById('in-workerid');
  if(idEl) idEl.focus();
  attachEnter();
}
function attachEnter(){
  document.querySelectorAll('[data-enter]').forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ window[el.dataset.enter](); } });
  });
}

function topbar(title, sub, showLogout){
  return `<div class="topbar">
    <div><div class="brand">${esc(title)}</div><div class="sub">${esc(sub)}</div></div>
    ${showLogout ? `<button onclick="logout()">Log out</button>` : ''}
  </div>`;
}

function screenHTML(){
  if(!S.worker) return loginScreen();
  let body;
  if(S.session) body = sessionScreen();
  else if(S.navTab==='logs') body = logsScreen();
  else if(S.screen==='activity' && S.bed) body = activityScreen();
  else body = scanScreen();
  return body + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '') + modalHTML();
}

function loginScreen(){
  return `
  ${topbar('WorkerApp','Ngapori Ranch — Field Execution')}
  <div class="content">
    <h1>Log in</h1>
    <p class="lead">Enter your Worker ID and PIN to start your shift.</p>
    ${S.loginErr ? `<div class="error">${esc(S.loginErr)}</div>` : ''}
    <div class="field"><label>Worker ID</label><input id="in-workerid" data-enter="doLogin" placeholder="usr-worker1" autocomplete="off"></div>
    <div class="field"><label>PIN</label><input id="in-pin" data-enter="doLogin" type="password" inputmode="numeric" placeholder="••••"></div>
    <button class="btn btn-primary" onclick="doLogin()">Log in</button>
    <p class="lead" style="margin-top:18px;font-size:12px;">Demo ID: usr-worker1 / 1234</p>
  </div>`;
}

function scanScreen(){
  return `
  ${topbar('WorkerApp', S.worker.name, true)}
  <div class="content">
    <h1>Scan a bed</h1>
    <p class="lead">Scan the bed's QR tag, or enter its code below to resolve the crop, cohort and allowed activities.</p>
    ${S.bedErr ? `<div class="error">${esc(S.bedErr)}</div>` : ''}
    <div class="field">
      <label>Bed code</label>
      <input id="in-bedcode" data-enter="resolveBed" placeholder="BED:B1-17" value="${esc(S.bedCode)}" oninput="setBedCode(this.value)" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="resolveBed()">Resolve bed</button>
    <p class="lead" style="margin:16px 0 6px;font-size:12px;">Camera scanning isn't available in this preview — tap a demo tag instead:</p>
    <div class="quickcodes">
      ${Object.keys(BEDS).map(c=>`<button class="quickcode" onclick="pickQuick('${c}')">${c}</button>`).join('')}
    </div>
  </div>
  ${navbar()}`;
}

function activityScreen(){
  const b = S.bed;
  const irr = S.bedIrrigationStatus[b.id];
  return `
  ${topbar('WorkerApp', S.worker.name, true)}
  <div class="content">
    <h1>${esc(b.id)}</h1>
    <p class="lead">${esc(b.block)} · ${esc(b.zone)}</p>
    <div class="card">
      <div class="row"><span>Crop</span><span>${esc(b.crop)}</span></div>
      <div class="row"><span>Cohort</span><span>${esc(b.cohort)}</span></div>
      ${irr ? `<div class="row"><span>Irrigation</span><span><span class="chip ${irr==='NORMAL'?'chip-ok':irr==='CRITICAL'?'chip-danger':'chip-warn'}">${irr}</span></span></div>` : ''}
    </div>
    <h2>Select activity</h2>
    ${b.activities.map(a=>`
      <button class="activity-btn" onclick="chooseActivity('${a}')" style="${S.activity===a?'border-color:var(--forest);background:var(--sand);':''}">
        <span>${labelize(a)}</span><span class="tag">${S.activity===a?'Selected':'Tap to select'}</span>
      </button>`).join('')}
    <button class="btn btn-primary" ${S.activity?'':'disabled'} onclick="startSession()" style="margin-top:8px;">Start session</button>
    <button class="btn btn-ghost" onclick="S.bed=null;S.activity=null;S.screen='scan';render();saveState();">Scan a different bed</button>
  </div>
  ${navbar()}`;
}

function labelize(a){
  return a.replace(/([a-z])([A-Z])/g,'$1 $2');
}

function sessionScreen(){
  const s = S.session;
  const paused = s.Session_Status==='PAUSED';
  return `
  ${topbar('WorkerApp', S.worker.name, false)}
  <div class="content">
    <h1>${labelize(s.Activity)}</h1>
    <p class="lead">${esc(s.Bed_ID)} · ${esc(s.Crop_ID)} · ${esc(s.Cohort_ID)}</p>
    <div class="card" style="text-align:center;">
      <div class="timer">${elapsedDisplay(s)}</div>
      <div class="timer-status">${paused ? '⏸ Paused' : '● Active'}${s.exceptionsLogged?` · ${s.exceptionsLogged} exception(s) reported`:''}</div>
    </div>
    ${paused
      ? `<button class="btn btn-primary" onclick="resumeSession()">Resume</button>`
      : `<button class="btn btn-warn" onclick="pauseSession()">Pause</button>`}
    <button class="btn btn-outline" onclick="openModal('exception')">Report exception</button>
    <button class="btn btn-danger" onclick="openCompleteModal()">Complete activity</button>
  </div>`;
}
function openCompleteModal(){
  if(S.activity==='IrrigationCheck') openModal('completeIrrigation');
  else if(S.activity==='Scouting') openModal('completeScouting');
  else if(S.activity==='Harvest') openModal('completeHarvest');
  else openModal('completeGeneric');
}

function navbar(){
  return `<div class="navbar">
    <button class="navitem ${S.navTab==='field'?'active':''}" onclick="setNav('field')"><div class="dot"></div>Field</button>
    <button class="navitem ${S.navTab==='logs'?'active':''}" onclick="setNav('logs')"><div class="dot"></div>Log</button>
  </div>`;
}

function logsScreen(){
  const t = S.tables;
  function section(title, rows, renderRow){
    return `<h2>${title} (${rows.length})</h2>
    <div class="loglist">
      ${rows.length ? rows.slice().reverse().slice(0,8).map(renderRow).join('') : `<div class="empty">Nothing logged yet.</div>`}
    </div>`;
  }
  return `
  ${topbar('WorkerApp', S.worker.name, true)}
  <div class="content">
    <h1>Activity feed</h1>
    <p class="lead">What this device has fed into FIELD_ACTIVITY_LOG, EXCEPTION_LOG and SCOUT_FINDING this session.</p>
    ${section('Completed activity', t.activityLog, r=>`
      <div class="logrow"><div class="t1">${labelize(r.Task_Type)} — ${esc(r.Bed_ID)}</div>
      <div class="t2">${fmtTime(r.End_Time)} · ${esc(r.Duration)}${r.Quantity?(' · '+esc(r.Quantity)+' '+esc(r.Unit)):''}</div></div>`)}
    ${section('Exceptions', t.exceptions, r=>`
      <div class="logrow"><div class="t1">${esc(r.Exception_Type)} <span class="chip ${r.Severity==='CRITICAL'||r.Severity==='HIGH'?'chip-danger':'chip-warn'}" style="margin-left:6px;">${esc(r.Severity)}</span></div>
      <div class="t2">${fmtTime(r.Timestamp)}${r.Irrigation_Zone_ID?(' · Zone '+esc(r.Irrigation_Zone_ID)):''}${r.Exception_Notes?(' · '+esc(r.Exception_Notes)):''}</div></div>`)}
    ${section('Scouting findings', t.scouting, r=>`
      <div class="logrow"><div class="t1">${esc(r.Domain)} — ${esc(r.Bed_ID)}</div>
      <div class="t2">${fmtTime(r.Timestamp)} · ${esc(r.Severity)}${r.Requires_Action==='TRUE'?' · action required':''}</div></div>`)}
    <button class="linkbtn" style="margin-top:8px;" onclick="if(confirm('Clear all demo data on this device?')){localStorage.removeItem('${STORE_KEY}');location.reload();}">Reset demo data</button>
  </div>
  ${navbar()}`;
}

/* ---------- modals ---------- */
function modalHTML(){
  if(!S.modal) return '';
  const m = S.modal;
  let inner;
  if(m==='exception') inner = exceptionModal();
  else if(m==='completeGeneric') inner = completeGenericModal();
  else if(m==='completeIrrigation') inner = completeIrrigationModal();
  else if(m==='completeScouting') inner = completeScoutingModal();
  else if(m==='completeHarvest') inner = completeHarvestModal();
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;
}
function selectSeg(name, options, cur){
  return `<div class="segbtns">${options.map(o=>`<button class="${cur===o?'active':''}" onclick="draft('${name}','${o}');render();">${o}</button>`).join('')}</div>`;
}

function exceptionModal(){
  const d = S.modalDraft;
  return `<div class="sheet-handle"></div>
  <h2>Report exception</h2>
  <div class="field"><label>Type</label>
    ${selectSeg('type', [...SCOUT_DOMAINS,'Irrigation'], d.type)}
  </div>
  ${d.type==='Irrigation' ? `<div class="field"><label>Fault type</label>${selectSeg('fault', IRRIGATION_FAULTS, d.fault)}</div>` : ''}
  <div class="field"><label>Severity</label>${selectSeg('severity', SEVERITIES, d.severity)}</div>
  <div class="field"><label>Notes</label><textarea oninput="draft('notes',this.value)">${esc(d.notes)}</textarea></div>
  <div class="field"><label>Photo URL (optional)</label><input oninput="draft('photo',this.value)" placeholder="https://..." value="${esc(d.photo)}"></div>
  <button class="btn btn-primary" onclick="submitException()">Submit exception</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function completeGenericModal(){
  const d = S.modalDraft;
  return `<div class="sheet-handle"></div>
  <h2>Complete: ${labelize(S.activity)}</h2>
  <div class="field"><label>Quantity (optional)</label><input inputmode="decimal" oninput="draft('qty',this.value)" value="${esc(d.qty)}"></div>
  <div class="field"><label>Unit (optional)</label><input oninput="draft('unit',this.value)" placeholder="e.g. beds, ft, trays" value="${esc(d.unit)}"></div>
  <div class="field"><label>Notes (optional)</label><textarea oninput="draft('notes',this.value)">${esc(d.notes)}</textarea></div>
  <button class="btn btn-danger" onclick="completeGeneric()">Complete session</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function completeIrrigationModal(){
  const d = S.modalDraft;
  return `<div class="sheet-handle"></div>
  <h2>Irrigation check result</h2>
  <div class="field"><label>Result</label>${selectSeg('result', ['PASS','FAIL'], d.result)}</div>
  ${d.result==='FAIL' ? `<div class="field"><label>Fault type</label>${selectSeg('fault', IRRIGATION_FAULTS, d.fault)}</div>` : ''}
  <div class="field"><label>Notes</label><textarea oninput="draft('notes',this.value)">${esc(d.notes)}</textarea></div>
  <div class="field"><label>Photo URL (optional)</label><input oninput="draft('photo',this.value)" value="${esc(d.photo)}"></div>
  <button class="btn ${d.result==='FAIL'?'btn-danger':'btn-primary'}" onclick="completeIrrigationCheck()">Complete session</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function completeScoutingModal(){
  const d = S.modalDraft;
  return `<div class="sheet-handle"></div>
  <h2>Scouting finding</h2>
  <div class="field"><label>Domain</label>${selectSeg('domain', SCOUT_DOMAINS, d.domain)}</div>
  <div class="field"><label>Symptom</label><input oninput="draft('symptom',this.value)" value="${esc(d.symptom)}"></div>
  <div class="field"><label>Severity</label>${selectSeg('severity', SEVERITIES, d.severity)}</div>
  <div class="field"><label>Requires action?</label>${selectSeg('requiresAction', ['Yes','No'], d.requiresAction===true?'Yes':d.requiresAction===false?'No':undefined)}</div>
  <div class="field"><label>Notes</label><textarea oninput="draft('notes',this.value)">${esc(d.notes)}</textarea></div>
  <div class="field"><label>Photo URL (optional)</label><input oninput="draft('photo',this.value)" value="${esc(d.photo)}"></div>
  <button class="btn btn-danger" onclick="draft('requiresAction', S.modalDraft.requiresAction==='Yes'); completeScouting()">Submit finding</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function completeHarvestModal(){
  const d = S.modalDraft;
  return `<div class="sheet-handle"></div>
  <h2>Harvest quantity</h2>
  <div class="field"><label>Quantity</label><input inputmode="decimal" oninput="draft('qty',this.value)" value="${esc(d.qty)}" placeholder="e.g. 12.5"></div>
  <div class="field"><label>Unit</label>${selectSeg('unit', HARVEST_UNITS, d.unit)}</div>
  <button class="btn btn-primary" onclick="completeHarvest()">Complete session</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}

/* ---------- boot + ticking timer ---------- */
render();
setInterval(()=>{ if(S.session && S.session.Session_Status==='ACTIVE'){ const el=document.querySelector('.timer'); if(el) el.textContent = elapsedDisplay(S.session); } }, 1000);
</script>
</body>
</html>
