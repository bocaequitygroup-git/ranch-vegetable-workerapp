<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPOS Worker</title>
<style>
:root{--bg:#0e1512;--card:#16211c;--line:#2a3a32;--ink:#eef5f0;--sub:#9db3a6;--accent:#5fd48a;--warn:#e0a53d;--bad:#e3584f;--ok:#3fae6c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f7f4;--card:#fff;--line:#dde5df;--ink:#16211c;--sub:#57685e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 2px 10px}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);border:1px solid var(--line);padding:5px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.sync{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:6px 0 2px} h2{font-size:16px;margin:0 0 10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;font-size:16px;margin-bottom:10px}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:14px;border:none;font-weight:700;font-size:16px;cursor:pointer;min-height:52px}
.btn.primary{background:var(--accent);color:#06231a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff} .btn.warn{background:var(--warn);color:#211a04}
.btn:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pin span{width:44px;height:52px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{padding:18px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:700;min-height:56px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:left;min-height:96px}
.tile b{display:block;font-size:15px;margin-bottom:4px} .tile span{color:var(--sub);font-size:12px}
.tile .ic{font-size:26px}
.banner{background:linear-gradient(135deg,#1c3327,var(--card));border:1px solid var(--ok);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.timerNum{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px;margin-bottom:12px}
.nav button{flex:1;background:transparent;border:none;color:var(--sub);font-weight:700;padding:8px;border-bottom:3px solid transparent}
.nav button.active{color:var(--ink);border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--sub);margin:2px 4px 2px 0}
.pill.sel{background:var(--accent);color:#06231a;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--ok);color:var(--ink);padding:14px 16px;border-radius:14px;max-width:480px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:50;transition:transform .25s,opacity .25s}
.toast.hide{transform:translateY(20px);opacity:0;pointer-events:none}
.hidden{display:none!important}
.logitem{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;color:var(--sub)}
.logitem b{color:var(--ink)}
a.link{color:var(--accent);font-size:13px}
video{width:100%;border-radius:12px;background:#000;margin-bottom:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast hide" id="toast"></div>
<script>
const STATE={worker:null,pin:'',screen:'login',tab:'home',timer:null,timerStart:0,timerBed:null,timerAct:null,queue:JSON.parse(localStorage.getItem('vpos_queue')||'[]'),history:JSON.parse(localStorage.getItem('vpos_history')||'[]'),online:navigator.onLine,syncing:false,scanning:false};
const ROSTER={"lisa":{pin:"1234",name:"Lisa Griffin"},"james":{pin:"1234",name:"James Clay"},"jon":{pin:"1234",name:"Jon Creem"},"linda":{pin:"1234",name:"Linda May"},"jessica":{pin:"1234",name:"Jessica Luka"}};
// Sourced from the USERS tab (Role=Worker, Status=ACTIVE). All workers currently share PIN 1234 per Ranch policy.
function findWorker(id){const k=Object.keys(ROSTER).find(w=>w.toLowerCase()===String(id).toLowerCase());return k?{id:k,...ROSTER[k]}:null;}
const CROPS=["MUS Mustard Greens","SUK Sukuma Wiki","BET Beets","CAR Carrots","TOM Tomatoes","OKR Okra","LET Lettuce","KAL Kale","BTL Bitter Leaf","MCH Mchicha"];
const ACTS=["Weeding","Transplanting","Scouting","Irrigation Maintenance","Harvest Prep","Bed Prep","Pest Control"];
const EXC=[["Pest Pressure","\u{1F41B}"],["Plant Condition / Wilting","\u{1F343}"],["Irrigation Fault","\u{1F4A7}"],["Other","\u26A0\uFE0F"]];
let db=null,dl=null;
try{claude.use("db").then(d=>{db=d;setStatus(navigator.onLine?'on':'off')});}catch(e){}
try{claude.use("downloads").then(d=>{dl=d;});}catch(e){}
window.addEventListener('online',()=>{STATE.online=true;flushQueue();});
window.addEventListener('offline',()=>{STATE.online=false;setStatus('off');});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hide'),2400);}
function setStatus(s){STATE._status=s;render();}
function fmt(n){return String(n).padStart(2,'0')}
function elapsed(){const s=Math.floor((Date.now()-STATE.timerStart)/1000);return fmt(Math.floor(s/3600))+':'+fmt(Math.floor(s/60)%60)+':'+fmt(s%60);}

async function saveDoc(col,data){
  const doc={...data,ts:new Date().toISOString(),worker:STATE.worker.id,workerName:STATE.worker.name};
  STATE.queue.push({col,doc,id:Math.random().toString(36).slice(2)});
  STATE.history.push({col,...doc});
  localStorage.setItem('vpos_queue',JSON.stringify(STATE.queue));
  localStorage.setItem('vpos_history',JSON.stringify(STATE.history));
  flushQueue();
}
function csvEscape(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
async function downloadLog(){
  if(!STATE.history.length){toast('Nothing logged yet');return;}
  if(!dl){try{dl=await claude.use("downloads");}catch(e){}}
  if(!dl){toast('Downloads unavailable in this view');return;}
  const cols=['ts','worker','workerName','col','bed','activity','durationSec','crop','cohort','qty','unit','packages','quality','type','severity','notes'];
  const rows=[cols.join(',')].concat(STATE.history.map(h=>cols.map(c=>csvEscape(h[c])).join(',')));
  try{
    await dl.save({filename:'vpos_worker_log_'+STATE.worker.id+'_'+Date.now()+'.csv',data:rows.join('\n')});
    toast('Log downloaded');
  }catch(err){
    const code=err&&err.code?err.code:'unavailable';
    if(code==='declined')toast('Download cancelled');
    else toast('Download failed: '+code);
  }
}
async function flushQueue(){
  if(!STATE.online||STATE.syncing||!STATE.queue.length)return;
  if(!db){try{db=await claude.use("db");}catch(e){}}
  if(!db){setStatus('off');return;}
  STATE.syncing=true;setStatus('sync');
  while(STATE.queue.length){
    const item=STATE.queue[0];
    try{await db.collection(item.col).doc(item.id).set(item.doc);STATE.queue.shift();localStorage.setItem('vpos_queue',JSON.stringify(STATE.queue));}
    catch(e){break;}
  }
  STATE.syncing=false;setStatus(STATE.queue.length?'off':'on');render();
}
setInterval(flushQueue,8000);

function doLogin(){
  const id=document.getElementById('unInput').value.trim();
  const pin=document.getElementById('pinInput').value.trim();
  const w=findWorker(id);
  if(!w){toast('Unknown username');return;}
  if(pin!==w.pin){toast('Incorrect PIN');return;}
  STATE.worker={id:w.id,name:w.name};STATE.screen='app';toast('Welcome, '+w.name);render();
}

function startScan(){
  STATE.scanning=true;render();
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    const v=document.getElementById('scanVideo');v.srcObject=stream;v.play();
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['qr_code']});
      const tick=async()=>{
        if(!STATE.scanning)return;
        try{const codes=await det.detect(v);if(codes.length){stopScan(stream);const bed=codes[0].rawValue.split('/').pop();STATE.timerBed=bed;toast('Bed loaded: '+bed);render();return;}}catch(e){}
        requestAnimationFrame(tick);
      };tick();
    }
  }).catch(()=>{toast('Camera unavailable \u2013 enter bed manually');STATE.scanning=false;render();});
}
function stopScan(stream){STATE.scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());render();}

function startTimer(){
  const bed=document.getElementById('bedInput')?.value||STATE.timerBed;
  const act=document.getElementById('actSel')?.value;
  if(!bed||!act){toast('Select bed and activity');return;}
  STATE.timerBed=bed;STATE.timerAct=act;STATE.timerStart=Date.now();
  STATE.timer=setInterval(render,1000);
  saveDoc('field_sessions',{bed,activity:act,status:'ACTIVE',startedAt:new Date().toISOString()});
  toast('Session started: '+act+' @ '+bed);render();
}
function stopTimer(){
  clearInterval(STATE.timer);const dur=Math.floor((Date.now()-STATE.timerStart)/1000);
  saveDoc('field_activity_log',{bed:STATE.timerBed,activity:STATE.timerAct,durationSec:dur,endedAt:new Date().toISOString()});
  toast('Logged '+Math.round(dur/60)+' min \u2013 '+STATE.timerAct);
  STATE.timer=null;STATE.timerBed=null;STATE.timerAct=null;render();
}

function submitHarvest(e){
  e.preventDefault();const f=e.target;
  saveDoc('harvest_log',{cohort:f.cohort.value,crop:f.crop.value,qty:f.qty.value,unit:f.unit.value,packages:f.pkg.value,quality:f.quality.value,notes:f.notes.value,bed:f.bed.value});
  toast('Harvest logged');f.reset();STATE.tab='home';render();
}
let photoData=null;
function onPhoto(input){
  const file=input.files[0];if(!file)return;
  const img=new Image();const reader=new FileReader();
  reader.onload=ev=>{img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,320/img.width);c.width=img.width*s;c.height=img.height*s;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.6);toast('Photo attached');};img.src=ev.target.result;};
  reader.readAsDataURL(file);
}
function submitException(e){
  e.preventDefault();const f=e.target;
  saveDoc('exception_log',{type:f.type.value,severity:f.severity.value,bed:f.bed.value,notes:f.notes.value,photo:photoData||null});
  toast('Exception reported');photoData=null;f.reset();STATE.tab='home';render();
}

function view(){
  if(STATE.screen==='login'){
    return `<div class="top"><div class="brand">\u{1F33E} VPOS Worker</div></div>
    <div class="card" style="margin-top:40px">
      <h1>Sign in</h1><p class="sub">Enter your username and PIN</p>
      <input id="unInput" placeholder="Username (e.g. lisa)" autocapitalize="none">
      <input id="pinInput" placeholder="PIN" type="password" inputmode="numeric" maxlength="4">
      <button class="btn primary" onclick="doLogin()">Sign In</button>
    </div>`;
  }

  const statusMap={on:['on','Connected'],off:['off','Offline'],sync:['sync','Syncing']};
  const [sc,sl]=statusMap[STATE._status||'off'];
  let body='';
  if(STATE.tab==='home'){
    body=`${STATE.timer?`<div class="banner"><div><div style="font-size:12px;color:var(--sub)">${STATE.timerAct} @ ${STATE.timerBed}</div><div class="timerNum">${elapsed()}</div></div><button class="btn bad" style="width:auto;padding:12px 18px" onclick="stopTimer()">Stop</button></div>`:''}
    <div class="tiles">
      <button class="tile" onclick="STATE.tab='scan';render()"><div class="ic">\u{1F4F7}</div><b>Scan Bed</b><span>QR code lookup</span></button>
      <button class="tile" onclick="STATE.tab='timer';render()"><div class="ic">\u23F1\uFE0F</div><b>${STATE.timer?'Session Active':'Start Task'}</b><span>Weeding, scouting...</span></button>
      <button class="tile" onclick="STATE.tab='harvest';render()"><div class="ic">\u{1F955}</div><b>Log Harvest</b><span>Qty, packages, grade</span></button>
      <button class="tile" onclick="STATE.tab='exception';render()"><div class="ic">\u26A0\uFE0F</div><b>Report Issue</b><span>Pest, wilt, irrigation</span></button>
    </div>
    <div class="card"><h2>Queue</h2><p class="sub">${STATE.queue.length?STATE.queue.length+' item(s) waiting to sync':'All caught up \u2014 everything synced'}</p>
    <button class="btn ghost" onclick="downloadLog()">\u2B07 Download My Log (CSV) \u2014 ${STATE.history.length} entries</button></div>`;
  } else if(STATE.tab==='scan'){
    body=`<div class="card"><h2>Scan Bed QR</h2>
    ${STATE.scanning?'<video id="scanVideo" playsinline muted></video><button class="btn ghost" onclick="stopScan()">Cancel</button>':`<button class="btn primary" onclick="startScan()">\u{1F4F7} Open Camera</button>`}
    <p class="sub" style="margin-top:12px">Or enter the bed code manually:</p>
    <input id="bedInput" placeholder="e.g. B4-01" value="${STATE.timerBed||''}">
    <button class="btn ghost" onclick="STATE.timerBed=document.getElementById('bedInput').value.toUpperCase();toast('Bed set: '+STATE.timerBed);STATE.tab='home';render()">Use This Bed</button>
    </div>`;
  } else if(STATE.tab==='timer'){
    body=`<div class="card"><h2>Field Session</h2>
    <input id="bedInput" placeholder="Bed code" value="${STATE.timerBed||''}">
    <select id="actSel">${ACTS.map(a=>`<option ${STATE.timerAct===a?'selected':''}>${a}</option>`).join('')}</select>
    ${STATE.timer?`<div style="text-align:center;margin:14px 0"><div class="timerNum">${elapsed()}</div></div><button class="btn bad" onclick="stopTimer()">Stop & Log Session</button>`:`<button class="btn primary" onclick="startTimer()">Start Timer</button>`}
    </div>`;
  } else if(STATE.tab==='harvest'){
    body=`<div class="card"><h2>Harvest Log</h2>
    <form onsubmit="submitHarvest(event)">
    <input name="bed" placeholder="Bed code" value="${STATE.timerBed||''}" required>
    <select name="crop" required><option value="">Crop / Cohort</option>${CROPS.map(c=>`<option>${c}</option>`).join('')}</select>
    <input name="cohort" placeholder="Cohort ID (e.g. BET-C01)">
    <div class="grid2"><input name="qty" type="number" step="0.1" placeholder="Quantity" required><select name="unit"><option>kg</option><option>bunches</option><option>pieces</option><option>crates</option></select></div>
    <input name="pkg" type="number" placeholder="Package count">
    <select name="quality"><option>Grade A</option><option>Grade B</option><option>Reject</option></select>
    <textarea name="notes" placeholder="Notes (optional)"></textarea>
    <button class="btn primary">Submit Harvest</button>
    </form></div>`;
  } else if(STATE.tab==='exception'){
    body=`<div class="card"><h2>Report Exception</h2>
    <form onsubmit="submitException(event)">
    <select name="type" required>${EXC.map(([t,i])=>`<option>${i} ${t}</option>`).join('')}</select>
    <div class="row">${['Low','Medium','High'].map(s=>`<span class="pill" data-sev="${s}" onclick="document.querySelectorAll('[data-sev]').forEach(p=>p.classList.remove('sel'));this.classList.add('sel');document.getElementById('sevInput').value=this.dataset.sev">${s}</span>`).join('')}</div>
    <input type="hidden" name="severity" id="sevInput" value="Medium">
    <input name="bed" placeholder="Bed code" value="${STATE.timerBed||''}" required>
    <textarea name="notes" placeholder="What did you observe?"></textarea>
    <input type="file" accept="image/*" capture="environment" onchange="onPhoto(this)">
    <button class="btn warn">Submit Report</button>
    </form></div>`;
  }
  return `<div class="top"><div class="brand">${STATE.tab==='home'?'\u{1F33E} '+STATE.worker.name:'\u2190'}</div>
  <div style="display:flex;align-items:center;gap:10px">${STATE.tab!=='home'?`<a class="link" onclick="STATE.tab='home';render()">Home</a>`:''}<div class="status"><span class="dot ${sc}"></span>${sl}</div></div></div>
  ${body}
  ${STATE.tab==='home'?`<button class="btn ghost" style="margin-top:6px" onclick="STATE.screen='login';STATE.worker=null;render()">Sign out</button>`:''}`;
}
function render(){document.getElementById('app').innerHTML=view();}
STATE.screen='login';render();
setStatus(navigator.onLine?'on':'off');
</script>
</body>
</html>
